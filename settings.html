<!-- settings.html for Hiyd extension -->
<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <title>Hiyd Settings</title>
        <style>
            body {
                font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
                margin: 0;
                padding: 0;
                background: #f5f7fa;
                color: #222;
            }

            .container {
                max-width: 420px;
                min-width: 320px;
                margin: 48px auto;
                background: #fff;
                border-radius: 16px;
                box-shadow: 0 4px 24px rgba(42, 122, 226, 0.07);
                padding: 2.5em 2em 2em 2em;
            }

            h1 {
                font-size: 1.7em;
                margin-bottom: 1.2em;
                color: #1a5bb8;
                font-weight: 700;
                letter-spacing: 0.5px;
            }

            form {
                margin-top: 1.5em;
                display: flex;
                flex-direction: column;
                gap: 1.7em;
            }

            .form-group {
                display: flex;
                flex-direction: column;
                gap: 0.7em;
            }

            label {
                font-weight: 600;
                margin-bottom: 0.1em;
                color: #222;
                font-size: 1.05em;
                letter-spacing: 0.1px;
            }

            .button-row {
                display: flex;
                gap: 1em;
                margin-top: 0.7em;
            }

            .picker-btn,
            button[type="submit"] {
                background: #f0f4fa;
                color: #1a5bb8;
                border: 1px solid #dbe6f6;
                border-radius: 6px;
                padding: 0.5em 1.3em;
                font-size: 1em;
                font-weight: 500;
                cursor: pointer;
                transition: background 0.2s, border 0.2s;
            }

            .picker-btn:hover,
            button[type="submit"]:hover {
                background: #e3eaf6;
                border: 1px solid #b3c6e6;
            }

            button[type="submit"] {
                color: #fff;
                background: #1a5bb8;
                border: none;
                font-weight: 600;
                box-shadow: 0 1px 4px rgba(42, 122, 226, 0.08);
                transition: background 0.2s;
            }

            button[type="submit"]:hover {
                background: #14508a;
            }

            .links {
                margin-top: 2.5em;
                text-align: center;
                font-size: 1.08em;
            }

            .links a {
                color: #1a5bb8;
                text-decoration: none;
                margin: 0 0.5em;
                transition: color 0.2s;
            }

            .links a:hover {
                color: #14508a;
                text-decoration: underline;
            }
        </style>
    </head>

    <body>
        <div class="container">
            <h1>Hiyd Settings</h1>
            <p>Pick a location for your saved files</p>
            <form id="settings-form">
                <div class="form-group">
                    <div class="button-row">
                        <button type="button" class="picker-btn" id="pickLocation">Choose…</button>
                        <button type="submit">Save Settings</button>
                    </div>
                </div>
            </form>
            <div class="links">
                <a href="https://github.com/hiyd-uk/hiyd-extension" target="_blank">GitHub</a> |
                <a href="https://hiyd.uk/" target="_blank">Website</a>
            </div>
        </div>
        <script src="settings.js"></script>
    </body>

</html>

name: Publish

on:
    push:
        branches: [main]
    workflow_dispatch:
        inputs:
            version:
                description: "Version to release"
                required: false
                default: "latest"

# Grant minimal permissions so the default GITHUB_TOKEN can create releases and generate release notes
permissions:
    contents: write    # required to create releases and upload release assets

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"

            - name: Install dependencies
              run: npm install

            - name: Run tests
              run: npm test

            - name: Get new version
              id: get_version
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  echo "version=$VERSION" >> $GITHUB_OUTPUT
                  DESCRIPTION=$(node -p "require('./package.json').description || ''")
                  echo "description=$DESCRIPTION" >> $GITHUB_OUTPUT
                  PREVIOUS=$(git tag --list --sort=-version:refname | grep -vx "v$VERSION" | head -n1)
                  echo "previous=$PREVIOUS" >> $GITHUB_OUTPUT

            - name: Build release notes
              id: notes
              uses: thechelsuk/workflows/.github/actions/release-notes@main
              with:
                  previous: ${{ steps.get_version.outputs.previous }}
                  description: ${{ steps.get_version.outputs.description }}

            - name: Build distribution
              run: bash build-distribution.sh

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: v${{ steps.get_version.outputs.version }}
                  name: Release v${{ steps.get_version.outputs.version }}
                  body_path: ${{ steps.notes.outputs.notes_file }}
                  files: distribution.zip
              # Use the default repository token rather than a custom PAT secret
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

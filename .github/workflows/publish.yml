name: Publish

on:
    push:
        branches: [main]
    workflow_dispatch:
        inputs:
            version:
                description: "Version to release"
                required: false
                default: "latest"

# Grant minimal permissions so the default GITHUB_TOKEN can create releases and generate release notes
permissions:
    contents: write    # required to create releases and upload release assets
    metadata: read     # read-only metadata access

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"

            - name: Install dependencies
              run: npm install

            - name: Run tests
              run: npm test

            - name: Get new version
              id: get_version
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  echo "version=$VERSION" >> $GITHUB_OUTPUT

            - name: Build distribution
              run: bash build-distribution.sh

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: v${{ steps.get_version.outputs.version }}
                  name: Release v${{ steps.get_version.outputs.version }}
                  generate_release_notes: true
                  files: distribution.zip
              # Use the default repository token rather than a custom PAT secret
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

[app]
name = "Hiyd"

[paths]
appstore = "screenshots"

[vars]
INK = "#221d15"
INK_SOFT = "#5c5341"
PANEL = "#fffdf6"
BG = "#f8f4e9"
ACCENT = "#1f6d46"
ACCENT_WASH = "#e6efe2"
LINE = "#e5dcc3"
SERIF = "'Fraunces', 'Iowan Old Style', Georgia, serif"
SANS = "'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
ICON = "${uri('assets/icon128.png')}"
FRAUNCES = "${uri('tools/fonts/Fraunces-700.woff2')}"
INTER = "${uri('tools/fonts/Inter-600.woff2')}"

[[pages]]
name = "defaults"
html = "settings.html"
size = [720, 760]
script = '''window.chrome = {storage: {sync: {
  get(keys, cb) { cb({frontMatterCustom: [{key: "series", value: "Notes on the web"}, {key: "lang", value: "en-GB"}]}); },
  set(obj, cb) { cb && cb(); }}}};'''

[[pages]]
name = "full"
html = "settings.html"
size = [720, 760]
script = '''window.chrome = {storage: {sync: {
  get(keys, cb) { cb({frontMatterCustom: [{key: "series", value: "Notes on the web"}, {key: "lang", value: "en-GB"}, {key: "source", value: "Reading list"}, {key: "status", value: "draft"}, {key: "rating", value: "5"}]}); },
  set(obj, cb) { cb && cb(); }}}};
document.addEventListener('DOMContentLoaded', () => { const st = document.createElement('style'); st.textContent = '.container > .header, .container > p, .container > h2, .container > ul, .container > .links, .container > .footer, form > .form-group:first-child { display: none } .container { margin-top: 24px }'; document.head.appendChild(st); });'''

[layouts.screenshot]
css = '''@font-face{font-family:'Fraunces';src:url(${FRAUNCES}) format('woff2');font-weight:700}
@font-face{font-family:'Inter';src:url(${INTER}) format('woff2');font-weight:600}
body{width:${W}px;height:${H}px;overflow:hidden;position:relative;font-family:${SANS};background:${BG}}
.brand{position:absolute;left:96px;top:88px;display:flex;align-items:center;gap:18px;color:${INK};font-family:${SERIF};font-size:30px;font-weight:700}
.brand img{width:52px;height:52px;border-radius:12px}
.head{position:absolute;left:96px;top:230px;width:430px}
h1{font-family:${SERIF};font-size:60px;line-height:1.04;font-weight:700;letter-spacing:-.02em;color:${INK}}
h1 b{color:${ACCENT};font-weight:700}
p{margin-top:28px;font-size:25px;line-height:1.4;font-weight:500;color:${INK_SOFT}}
.shot{position:absolute;right:96px;top:70px;height:660px;border-radius:18px;
  box-shadow:0 0 0 2px ${LINE},0 40px 90px rgba(34,29,21,.18)}'''
body = '''<div class="brand"><img src="${ICON}">Hiyd</div>
<div class="head"><h1>${title}</h1><p>${sub}</p></div>
<img class="shot" src="${shot}">'''

[layouts.tile]
css = '''@font-face{font-family:'Fraunces';src:url(${FRAUNCES}) format('woff2');font-weight:700}
@font-face{font-family:'Inter';src:url(${INTER}) format('woff2');font-weight:600}
body{width:${W}px;height:${H}px;overflow:hidden;font-family:${SANS};background:${BG};
  display:flex;flex-direction:column;justify-content:center;padding:0 40px}
.brand{display:flex;align-items:center;gap:16px}
.brand img{width:64px;height:64px;border-radius:14px}
h1{font-family:${SERIF};font-size:44px;font-weight:700;letter-spacing:-.01em;color:${INK}}
p{margin-top:22px;font-family:${SANS};font-size:21px;line-height:1.35;font-weight:600;color:${INK_SOFT}}
p b{color:${ACCENT}}'''
body = '''<div class="brand"><img src="${ICON}"><h1>Hiyd</h1></div>
<p>${title}</p>'''

[[slides.main]]
screen = "defaults"
title = "Quote the web, <b>straight into Jekyll</b>"
sub = "Highlight text, right-click, and save a Markdown quote post with front matter."

[[slides.main]]
screen = "full"
title = "Add your own <b>front matter</b>"
sub = "Up to five custom items, saved to your Chrome sync, added to every capture."

[[slides.tile]]
screen = "defaults"
title = "Save highlighted quotes as <b>Jekyll posts</b>"

[[frame]]
raw = "pages"
sizes = ["webstore"]
layout = "screenshot"
slides = "main"

[[frame]]
raw = "pages"
sizes = ["webstore-tile"]
layout = "tile"
slides = "tile"
